<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Orren — Living SIR Field</title>
<style>
:root{--bg:#07120f;--panel:#0d1e19;--line:#21443a;--text:#e9f4ee;--muted:#91ada3;--gold:#d7b56d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#17483a,#07120f 48%);color:var(--text);font:14px/1.5 system-ui,sans-serif}.shell{display:grid;grid-template-columns:270px 1fr 320px;min-height:100vh}.rail,.inspector{background:#0d1e19dd;border:1px solid var(--line);padding:24px}.brand{font-size:25px;letter-spacing:.24em;color:var(--gold)}.muted{color:var(--muted)}.status{margin:20px 0;padding:12px;border:1px solid var(--line);border-radius:12px}.main{padding:28px;overflow:auto}.toolbar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}.tab,button{border:1px solid #6d5b36;background:#17160f;color:var(--gold);border-radius:10px;padding:10px 12px;cursor:pointer}.tab{background:transparent}.intent{width:100%;padding:12px;background:#081813;border:1px solid var(--line);border-radius:10px;color:var(--text)}.tree{max-width:850px;margin:auto}.node{display:flex;gap:12px;align-items:center;padding:15px;margin:8px 0;background:#122d25e6;border:1px solid var(--line);border-radius:14px;cursor:pointer}.node:hover{border-color:#9c8145}.glyph{color:var(--gold);font-size:18px}.meta{margin-left:auto;color:var(--muted);font-size:12px}.children{margin-left:28px;border-left:1px solid var(--line);padding-left:14px}.kv{padding:9px 0;border-bottom:1px solid #91ada322}.empty{color:var(--muted);text-align:center;padding:70px 20px}pre{white-space:pre-wrap;color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:1fr}.rail,.inspector{display:none}}
</style></head>
<body><div class="shell"><aside class="rail"><div class="brand">ORREN</div><div class="muted">Meaning • Context • Expression</div><div id="status" class="status">Converging</div><input id="intent" class="intent" placeholder="Describe an intent…"><button onclick="sendIntent()">Inject intent</button><p class="muted">The field is the API. The hub is its seeing surface.</p></aside>
<main class="main"><div class="toolbar"><button class="tab" onclick="setView('tree')">Semantic Tree</button><button class="tab" onclick="setView('flow')">Flow Graph</button><button class="tab" onclick="setView('lens')">Dimension Lens</button><button class="tab" onclick="setView('realization')">Realization</button><button class="tab" onclick="setView('provenance')">Provenance</button></div><section id="view" class="tree"></section></main>
<aside class="inspector"><h3>Semantic Inspector</h3><div id="inspector" class="empty">Select a node.</div></aside></div>
<script>
let state={nodes:[],edges:[],state:'converging'},selected=null,view='tree';
const dims=['expression','cognitive','vibe','spatial','temporal','relational','conditional','behavioral','equilibrium'];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function kids(id){return state.edges.filter(e=>e.src===id&&e.kind==='contains').map(e=>state.nodes.find(n=>n.id===e.dst)).filter(Boolean)}
function draw(n){return '<div class="node" onclick="selectNode(\''+n.id+'\')"><span class="glyph">◈</span><strong>'+esc(n.name)+'</strong><span class="meta">'+Math.round(n.confidence*100)+'%</span></div>'+kids(n.id).map(c=>'<div class="children">'+draw(c)+'</div>').join('')}
function render(){document.getElementById('status').textContent=state.state+' · cycle '+state.cycle;let roots=state.nodes.filter(n=>!state.edges.some(e=>e.kind==='contains'&&e.dst===n.id));document.getElementById('view').innerHTML=view==='tree'?(roots.length?roots.map(draw).join(''):'<div class="empty">The semantic field is empty.</div>'):'<div class="empty">'+esc(view)+' view — shared-field renderer connected.</div>';if(selected)selectNode(selected)}
function selectNode(id){selected=id;let n=state.nodes.find(x=>x.id===id);if(!n)return;document.getElementById('inspector').innerHTML='<h3>'+esc(n.name)+'</h3>'+dims.map(d=>'<div class="kv"><b>'+d+'</b><br>'+esc(JSON.stringify(n.dimensions[d]??'—'))+'</div>').join('')+'<pre>'+esc(JSON.stringify(n.provenance,null,2))+'</pre>'}
function setView(v){view=v;render()}
async function sendIntent(){let s=document.getElementById('intent').value;if(!s)return;ws.send(JSON.stringify({type:'intent',source:s}));document.getElementById('intent').value=''}
const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.onmessage=e=>{state=JSON.parse(e.data);render()};ws.onopen=render;
</script></body></html>
